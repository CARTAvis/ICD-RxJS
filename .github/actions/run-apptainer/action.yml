name: 'Run ICD tests via Apptainer'
description: 'Start carta_backend and run ICD tests'
inputs:
  os_version:
    description: 'Platform'
    required: true
  image:
    description: 'Apptainer image'
    required: true
  port:
    description: 'Port number for carta_backend'
    required: true
  test_stage_name:
    description: 'ICD test stage'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run ICD tests via Apptainer
      run: |
        set -eo pipefail  # Make script exit on any error
    
        SRC_DIR=$GITHUB_WORKSPACE/source
        BUILD_DIR=$GITHUB_WORKSPACE/build-${{ inputs.os_version }}
        TEST_STAGE="$BUILD_DIR/ICD-RxJS/ICD_test_stages/${{ inputs.test_stage_name }}.tests"
        LOG_FILE="/tmp/carta_icd_${{ inputs.os_version }}_${{ inputs.test_stage_name }}.log"
        
        # Function to cleanup backend process
        cleanup() {
          local backend_pid=$(pgrep -f "carta_backend.*${{ inputs.port }}" | head -n 1)
          if [ ! -z "$backend_pid" ]; then
            echo "Cleaning up carta_backend (PID: $backend_pid)"
            kill -9 "$backend_pid" || true
          fi
        }
        
        # Set trap for cleanup
        trap cleanup EXIT
        
        apptainer exec \
          --bind $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
          --bind /images:/images \
          --pwd $BUILD_DIR \
          ${{ inputs.image }} /bin/bash -c "\
            bash $BUILD_DIR/ICD-RxJS/scripts/start_backend.sh $SRC_DIR $BUILD_DIR ${{ inputs.port }} $LOG_FILE && \
            # Run the ICD tests
            cd $BUILD_DIR/ICD-RxJS && \
            pwd && \
            cat $TEST_STAGE && \
            failed_tests=() && \
            crash_sites=() && \
            skipped_tests=() && \
            restarts=0 && \
            max_restarts=3 && \
            mapfile -t test_files < $TEST_STAGE && \
            for test_index in \"\${!test_files[@]}\"; do
              test_file=\"\${test_files[\$test_index]}\"
              if [ -n \"\$test_file\" ]; then  # Skip empty lines
                if ! CI=true npm test -- \"\$test_file\"; then
                  failed_tests+=(\"\$test_file\")
                fi
                # A backend which has died takes every remaining file in the stage with it, each
                # reporting a connection failure instead of the crash which actually caused it.
                # The tests hold no state in the backend -- every file connects and loads for
                # itself -- so a fresh backend lets the rest of the stage run for real.
                if ! bash scripts/wait_for_backend.sh ${{ inputs.port }} 0 $LOG_FILE; then
                  crash_sites+=(\"\$test_file\")
                  if [ \"\$restarts\" -ge \"\$max_restarts\" ]; then
                    echo \"carta_backend crashed after \$test_file and has already been restarted \$restarts times; abandoning the rest of the stage\"
                    skipped_tests=(\"\${test_files[@]:\$((test_index + 1))}\")
                    break
                  fi
                  restarts=\$((restarts + 1))
                  echo \"carta_backend crashed after \$test_file; restarting (\$restarts of \$max_restarts)\"
                  if ! bash scripts/start_backend.sh $SRC_DIR $BUILD_DIR ${{ inputs.port }} $LOG_FILE; then
                    echo \"carta_backend could not be restarted; abandoning the rest of the stage\"
                    skipped_tests=(\"\${test_files[@]:\$((test_index + 1))}\")
                    break
                  fi
                fi
              fi
            done && \
            if [ \${#crash_sites[@]} -ne 0 ]; then
              echo \"carta_backend crashed after:\"
              printf '  %s\n' \"\${crash_sites[@]}\"
            fi && \
            remaining_tests=() && \
            for skipped_test in \"\${skipped_tests[@]}\"; do
              if [ -n \"\$skipped_test\" ]; then
                remaining_tests+=(\"\$skipped_test\")
              fi
            done && \
            if [ \${#remaining_tests[@]} -ne 0 ]; then
              echo \"The following tests did not run:\"
              printf '  %s\n' \"\${remaining_tests[@]}\"
            fi && \
            if [ \${#failed_tests[@]} -ne 0 ]; then
              echo \"The following tests failed:\" && \
              printf '%s\n' \"\${failed_tests[@]}\"
            fi && \
            if [ \${#failed_tests[@]} -ne 0 ] || [ \${#crash_sites[@]} -ne 0 ]; then
              exit 1
            fi"
      shell: bash

    - name: Upload backend log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: carta-backend-log-${{ inputs.os_version }}-${{ inputs.test_stage_name }}
        path: /tmp/carta_icd_${{ inputs.os_version }}_${{ inputs.test_stage_name }}.log
        retention-days: 14
