name: ICD tests on macOS 27
on:
  workflow_dispatch:
    inputs:
      # Can only define up to 10 inputs in a workflow_dispatch event
      carta_backend_branch:
        description: 'carta-backend branch to use'
        required: true
        default: 'dev'
      file_browser_animator_icd_tests:
        description: 'File-Browser and Animator'
        required: false
        type: boolean
      region_statistics_manipulation_icd_tests:
        description: 'Region-Statistics and Region-Manipulation'
        required: false
        type: boolean 
      cube_histogram_pv_generator_icd_tests:    
        description: 'Cube-Histogram and PV-Generator'
        required: false
        type: boolean
      raster_tiles_catalog_icd_tests:    
        description: 'Raster-Tiles and Catalog'
        required: false
        type: boolean
      moment_match_icd_tests:    
        description: 'Moment and Match'
        required: false
        type: boolean
      close_files_image_fitting_icd_tests:    
        description: 'Close-File and Image-Fitting'
        required: false
        type: boolean
      vector_overlay_resume_icd_tests:    
        description: 'Vector-Overlay and Resume'
        required: false
        type: boolean

env:
  CARTA_BACKEND_BRANCH_NAME: ${{ inputs.carta_backend_branch }}

jobs:
  Build:
    name: Build ${{ matrix.os_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_version: macOS-27
            os: macos
            runner: [macOS-27, ICD]
            port: 5555

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: CARTAvis/carta-backend
          ref:  ${{ env.CARTA_BACKEND_BRANCH_NAME }}
          path: source

      - name: System information (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          uname -a
          sw_vers

      - name: Build carta-backend (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          export Protobuf_ROOT="/opt/homebrew/opt/protobuf@21"
          SRC_DIR=$GITHUB_WORKSPACE/source
          BUILD_DIR=$GITHUB_WORKSPACE/build
          cd $SRC_DIR && git submodule update --init
          rm -rf $BUILD_DIR && mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          cmake $SRC_DIR \
            -Dtest=on \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDevSuppressExternalWarnings=ON \
            -DCMAKE_CXX_FLAGS="-O0 -g -fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          make -j 16

      - name: Check backend runs (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          ./build/carta_backend --version

  Prepare-ICD-RxJS:
    name: Prepare-ICD-RxJS ${{ matrix.os_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_version: macOS-27
            os: macos
            runner: [macOS-27, ICD]
            port: 5555

    needs: Build              
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ICD-RxJS

      - name: System information (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          uname -a
          sw_vers

      - name: Prepare ICD-RxJS (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          ICD_DIR=$GITHUB_WORKSPACE/ICD-RxJS
          cd $ICD_DIR
          git submodule init && git submodule update && npm install
          cd protobuf
          ./build_proto.sh
          cd ../src/test
          perl -p -i -e 's/3002/${{ matrix.port }}/' config.json

  File-Browser-ICD-Tests:
    name: File-Browser ${{ matrix.os_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_version: macOS-27
            os: macos
            runner: [macOS-27, ICD]
            port: 5555

    needs: [Build, Prepare-ICD-RxJS]
    if: ${{ github.event.inputs.file_browser_animator_icd_tests == 'true' }} 
    steps:
      # macOS steps
      - name: File Browser ICD tests
        if: matrix.os == 'macos'
        uses: ./ICD-RxJS/.github/actions/run-macos
        with:
          port: ${{ matrix.port }}
          test_stage_name: 'file_browser'
      # Linux steps    
      - name: File Browser ICD tests
        if: matrix.os == 'linux'
        uses: ./ICD-RxJS/.github/actions/run-apptainer
        with:
          os_version: ${{ matrix.os_version }}
          image: ${{ matrix.image }}
          port: ${{ matrix.port }}
          test_stage_name: 'file_browser'

